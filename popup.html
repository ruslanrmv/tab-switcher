<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 330px; margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #10111a; color: #f6f6fb; }
  .header { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  .header img { width: 40px; height: 40px; border-radius: 12px; }
  .eyebrow { margin: 0 0 3px; color: #aaa9ff; font-size: 10px; font-weight: 700; letter-spacing: .12em; }
  h1 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
  .status { display: flex; align-items: center; gap: 9px; padding: 12px; margin-bottom: 17px; border: 1px solid #303341; border-radius: 11px; background: #191b27; }
  .status-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #a4a4b5; }
  .status.connected .status-dot { background: #75d8ae; box-shadow: 0 0 12px #75d8ae66; }
  .status.disconnected .status-dot { background: #f4a28e; }
  .status-text { font-size: 12px; line-height: 1.35; color: #d8d9e4; }
  .section-title { margin: 0 0 8px 2px; font-size: 10px; letter-spacing: .1em; color: #9293a5; font-weight: 700; }
  .shortcuts { border: 1px solid #2c2e3d; border-radius: 13px; background: #191b27; padding: 2px 12px; }
  .shortcut { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 0; }
  .shortcut + .shortcut { border-top: 1px solid #2b2d3a; }
  .shortcut-label { font-size: 12px; color: #e3e3ed; }
  .keys { display: flex; align-items: center; gap: 4px; }
  .key { border: 1px solid #424458; background: #262838; border-radius: 6px; padding: 4px 6px; color: #f1f1fa; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .key-plus { color: #8d8fa1; font-size: 10px; }
  .update-banner { display: none; margin-bottom: 14px; padding: 10px; border-radius: 9px; color: #e6cf85; background: #3c3420; font-size: 12px; line-height: 1.4; }
  .update-banner a { color: inherit; }
  .version-label { margin-top: 15px; text-align: right; color: #77798a; font-size: 10px; }
</style>
</head>
<body>
  <header class="header"><img src="icon48.png" alt=""><div><p class="eyebrow">TAB SWITCHER</p><h1>Переключение вкладок</h1></div></header>
  <div class="status" id="status"><span class="status-dot"></span><span class="status-text" id="status-text">Проверяем подключение…</span></div>
  <div class="update-banner" id="update-banner"></div>
  <p class="section-title">БЫСТРЫЕ КЛАВИШИ</p>
  <div class="shortcuts">
    <div class="shortcut"><span class="shortcut-label">Переключить вкладку</span><span class="keys" id="tab-switch-keys"><span class="key">⌃ Ctrl</span><span class="key-plus">+</span><span class="key">Tab</span></span></div>
    <div class="shortcut"><span class="shortcut-label">Скопировать ссылку</span><span class="keys" id="copy-url-keys"><span class="key">⇧⌘C</span></span></div>
  </div>
  <div class="version-label" id="version-label"></div>
  <script src="popup.js"></script>
</body>
</html>
